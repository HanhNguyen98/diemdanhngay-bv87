# Profile: prod — deploy server viện (Docker / reverse proxy)
# Kích hoạt: SPRING_PROFILES_ACTIVE=prod
# DB credentials: prod-secrets.yml hoặc biến môi trường DB_*

spring:
  config:
    import: optional:file:./prod-secrets.yml
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:diemdanhngay_bv87_db}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        name: BV87SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.bv87.diemdanh: INFO

app:
  security:
    cors:
      # Override: APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS=url1,url2
      allowed-origin-patterns:
        - "http://192.170.182.14:8081"
        - "https://192.170.182.14:8081"
    login-rate-limit:
      enabled: true
      max-attempts: 5
      window-minutes: 15
      lockout-minutes: 15
