# Production — Bệnh viện Quân y 87 (D5: WPF + Spring, không SPA)
# Server 192.170.182.14 — cùng máy web khảo sát (:8080)
#
# Chuẩn bị:
#   1. Copy backend/prod-secrets.example.yml → backend/prod-secrets.yml (hoặc set DB_* env)
#   2. Tạo DB diemdanhngay_bv87_db + user diemdanh_user trên MySQL host
#
# Lệnh:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Client WPF / Agent: http://192.170.182.14:8081/api/...
# Cấm Cloudflare Tunnel cho app chấm công (SPEC_DESKTOP §1.1).

name: diemdanh-bv87

services:
  diemdanh-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: diemdanh-backend
    restart: unless-stopped
    ports:
      - "${ATTENDANCE_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-diemdanhngay_bv87_db}
      DB_USER: ${DB_USER:-diemdanh_user}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env or environment}
      DISK_STATUS_PATH: ${DISK_STATUS_PATH:-/app/backup/disk-status.json}
    volumes:
      # Host Windows C: status — written by deploy/scripts/write-disk-status.ps1 (D-DISK.1)
      - ../backup:/app/backup:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - diemdanh-net

networks:
  diemdanh-net:
    driver: bridge
